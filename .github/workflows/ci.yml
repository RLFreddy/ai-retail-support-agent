name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"  # fail if uv.lock is out of date with pyproject.toml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # cz check reads the commits of the pull request
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Conventional commit messages
        if: github.event_name == 'pull_request'
        run: uv run cz check --rev-range "origin/${{ github.base_ref }}..HEAD"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make eval

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: make mcp-smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tiendahogar .
      - name: Smoke test the image (mock model, non-root)
        run: |
          docker run --rm tiendahogar ask "How long is the warranty on a refrigerator?" \
            | grep -q "Source: Warranty policy"
          test "$(docker run --rm --entrypoint id tiendahogar -u)" = 10001
      - name: Smoke test the HTTP API
        run: |
          docker run -d --name api -p 7860:7860 tiendahogar
          curl -sf --retry 20 --retry-delay 1 --retry-all-errors localhost:7860/health
          curl -sf -X POST localhost:7860/chat -H "content-type: application/json" \
            -d '{"message": "Where is my order ORD-1002?"}' | grep -q ORD-1002
          docker rm -f api
