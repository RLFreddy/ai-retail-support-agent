[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiendahogar"]

[project]
name = "tiendahogar-support-agent"
version = "0.1.0"
description = "Customer support agent for a home appliance store: RAG, tool calling and guardrails"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.16",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "openai>=2.53.0",
    "pydantic-ai-slim[groq,openai]>=2.31.1",
    "pydantic-settings>=2.14.2",
    "pystemmer>=3.1.0",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
]

[project.scripts]
tiendahogar = "tiendahogar.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.162.0",
    "gradio>=6.31.0",
    "uvicorn[standard]>=0.52.1",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest==9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "BLE", "PT"]
#: Dashes LLMs write in ranges ("5‑10 days") and the CLI's separator.
allowed-confusables = ["‐", "‑", "‒", "–", "—", "·"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["bm25s.*", "Stemmer"]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
