[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiendahogar"]

[project]
name = "tiendahogar-support-agent"
version = "0.1.0"
description = "Agente de soporte al cliente TiendaHogar: RAG + tool consultar_estado_pedido + guardrails"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.16",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "litellm==1.95.0",
    "numpy>=2.5.1",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "pystemmer>=3.1.0",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.9",
]

[project.scripts]
tiendahogar = "tiendahogar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["EXE001", "EXE002"]
